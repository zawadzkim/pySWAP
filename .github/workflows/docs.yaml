name: Documentation

# Versioned documentation with mike on the gh-pages branch:
# - push to dev: deploys the "dev" version
# - release (called by cd.yaml with the version): deploys the minor version
#   (e.g. 0.3) with the "latest" alias, which the site root redirects to
on:
  push:
    branches: [dev]
  workflow_call:
    inputs:
      version:
        description: "Released version (e.g. 0.3.10); empty deploys dev"
        type: string
        required: false
        default: ""
      build-only:
        description: "Only build the docs, do not deploy"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Released version (e.g. 0.3.10); run from the release tag. Empty deploys dev"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    # Deployments push to gh-pages; never run two at once
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.70.2
          cache: true

      - name: Build documentation
        if: ${{ inputs.build-only }}
        run: pixi run -e docs docs-build

      - name: Deploy documentation
        if: ${{ !inputs.build-only }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          if [ -n "$VERSION" ]; then
            minor="${VERSION%.*}"
            pixi run -e docs mike deploy --push --update-aliases "$minor" latest
            pixi run -e docs mike set-default --push latest
          else
            pixi run -e docs mike deploy --push dev
          fi

      - name: Keep the 404 redirect for unversioned links
        if: ${{ !inputs.build-only }}
        run: |
          git worktree add ../gh-pages gh-pages
          cp .github/pages/404.html ../gh-pages/404.html
          cd ../gh-pages
          git add 404.html
          if ! git diff --cached --quiet; then
            git commit -m "Update 404 redirect"
            git push origin gh-pages
          fi
